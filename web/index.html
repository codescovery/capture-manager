<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capture Manager Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Capture Manager <span>web prototype</span></h1>
    <div class="actions">
      <button id="add" type="button">+ Add window</button>
      <button id="float" type="button" hidden>Floating controls</button>
      <button id="bridge" type="button">Focus bridge</button>
    </div>
  </header>

  <main>
    <section class="stage">
      <canvas id="output" width="1280" height="720"></canvas>
      <p id="empty">Add one or more windows, then share <b>this tab or window</b> in Teams, Meet or OBS. Only the selected source is shown here.</p>
    </section>

    <aside>
      <h2>Sources <small>(keys 1-9 switch)</small></h2>
      <ul id="sources"></ul>
      <p id="status" role="status"></p>
    </aside>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
