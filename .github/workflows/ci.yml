name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore src/Codescovery.CaptureManager.sln
      - name: Build
        run: dotnet build src/Codescovery.CaptureManager.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test src/Codescovery.CaptureManager.sln --configuration Release --no-build
